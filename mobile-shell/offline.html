<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050829" />
    <title>TIME — Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; background: radial-gradient(circle at 50% 0, #3700f0 0, #050829 48%); color: #fff; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: min(70vw, 280px); height: auto; }
      h1 { margin: 36px 0 12px; font-size: 25px; }
      p { margin: 0; color: #d7d8e7; line-height: 1.55; }
      button { width: 100%; min-height: 52px; margin-top: 28px; border: 0; border-radius: 14px; background: #fff; color: #050829; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="time-logo.png" alt="TIME Escola de Negócios" />
      <h1>Você está sem conexão</h1>
      <p>Reconecte-se à internet para continuar usando a TIME.</p>
      <button type="button" onclick="location.href='https://app.timeescoladenegocios.com.br'">Tentar novamente</button>
    </main>
  </body>
</html>
